
# ==========================================
# Application Configuration
# ==========================================
spring.application.name=online-bookstore

# ==========================================
# H2 Database Configuration
# ==========================================
spring.datasource.url=jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway Configuration
# ==========================================
spring.flyway.enabled=false

# ==========================================
# H2 Console Configuration
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Swagger / OpenAPI Configuration
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-this-1234567890}
app.jwt.expiration-ms=3600000
app.jwt.issuer=online-bookstore

# ==========================================
# Server Error Configuration
# ==========================================
server.error.include-message=never

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000

spring.profiles.active=dev